<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" width="1080" height="920" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#888888;--accent:#0078D4;--muted:#AAAAAA;--surface:#181818;--border:#444444;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 65%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 45%, var(--bg)));
    --_line:          var(--line, #666666);
    --_arrow:         var(--accent, #0078D4);
    --_node-fill:     var(--surface, #181818);
    --_node-stroke:   var(--border, #444444);
    --_group-fill:    #1A1A1A;
    --_group-hdr:     #252525;
    --_inner-stroke:  #383838;
    --_badge-fill:    #1F1F1F;
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-dotted" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_line)" stroke="var(--_line)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>

<!-- GROUP 1: Layer 4: Cross-Session Memory & Two-Phase Discovery Router -->
<g class="subgraph" data-id="MemoryRouter" data-label="4. Cross-Session Memory &amp; Two-Phase Discovery">
  <rect x="160" y="40" width="870" height="125" rx="6" ry="6" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <path d="M 160 46 Q 160 40 166 40 L 1024 40 Q 1030 40 1030 46 L 1030 68 L 160 68 Z" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="175" y="55" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4">4. Cross-Session Memory &amp; Two-Phase Discovery Gateway</text>
</g>

<!-- GROUP 2: Layers 1 & 2: Codebase Discovery -->
<g class="subgraph" data-id="Discovery" data-label="1 &amp; 2. Codebase Discovery">
  <rect x="160" y="240" width="870" height="125" rx="6" ry="6" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <path d="M 160 246 Q 160 240 166 240 L 1024 240 Q 1030 240 1030 246 L 1030 268 L 160 268 Z" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="175" y="255" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4">1 &amp; 2. Codebase Discovery (On-Demand WASM AST + Deep Indexers)</text>
</g>

<!-- GROUP 3: Layer 3: In-Flight Continuity Ledger -->
<g class="subgraph" data-id="InFlight" data-label="3. In-Flight Continuity Ledger">
  <rect x="230" y="445" width="800" height="425" rx="6" ry="6" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <path d="M 230 451 Q 230 445 236 445 L 1024 445 Q 1030 445 1030 451 L 1030 473 L 230 473 Z" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="245" y="460" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4">3. In-Flight Continuity Ledger (paragon-ux/waymark)</text>
</g>

<!-- NODES IN GROUP 1 -->
<g class="node" data-id="Router">
  <rect x="185" y="88" width="460" height="44" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="415" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">capn_ask (Two-Phase Router: Structural AST vs. Memory)</text>
</g>

<g class="node" data-id="Capn">
  <rect x="685" y="88" width="325" height="44" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="847" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Capn Hook (Charted Q&amp;A Knowledge Base)</text>
</g>

<!-- NODES IN GROUP 2 -->
<g class="node" data-id="WASM">
  <rect x="185" y="288" width="460" height="44" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="415" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Built-in Tree-sitter WASM (&lt;50ms Call Graphs &amp; Symbols)</text>
</g>

<g class="node" data-id="DeepIndexers">
  <rect x="685" y="288" width="325" height="44" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="847" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Deep Indexers (QMD &amp; Language Servers)</text>
</g>

<!-- NODES IN GROUP 3 -->
<g class="node" data-id="WM">
  <rect x="360" y="495" width="510" height="46" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="615" y="513" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Waymark MCP Server (Append-Only NDJSON Journal)</text>
</g>

<g class="node" data-id="SpanCheck">
  <rect x="340" y="605" width="550" height="46" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="615" y="623" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Span Integrity &amp; Relocation Scan (MOVED / STALE / CROSS_BRANCH)</text>
</g>

<g class="node" data-id="ResumePkt">
  <rect x="490" y="775" width="460" height="46" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="720" y="793" text-anchor="middle" font-size="13" font-weight="600" fill="var(--_text)" dy="4.5">Bounded Resume Packet (under 2,048 bytes / ~216 tokens)</text>
</g>

<!-- CONNECTING EDGES -->

<!-- 1. Router -> WASM: Structural intent -->
<polyline class="edge" points="415,132 415,288" fill="none" stroke="var(--_arrow)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="305" y="188" width="220" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="415" y="202" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)" dy="3.8">Structural query ("Who calls X?")</text>
</g>

<!-- 2. Router -> Capn: Conceptual intent / fallback -->
<polyline class="edge" points="645,110 685,110" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="620" y="60" width="130" height="24" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="685" y="72" text-anchor="middle" font-size="10" font-weight="500" fill="var(--_text-sec)" dy="3.5">Memory recall</text>
</g>

<!-- 3. WASM -> Waymark: Verified evidence -->
<polyline class="edge" points="415,332 415,395 520,395 520,495" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="350" y="380" width="210" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="455" y="394" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)" dy="3.8">Agent records verified AST hops</text>
</g>

<!-- 4. DeepIndexers -> Waymark: Deep search candidates -->
<polyline class="edge" points="847,332 847,395 720,395 720,495" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="710" y="380" width="200" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="810" y="394" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)" dy="3.8">Deep search candidates verified</text>
</g>

<!-- 5. Capn -> DeepIndexers: Dotted prior charts query -->
<polyline class="edge" points="847,132 847,288" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead-dotted)" />
<g class="edge-label">
  <rect x="760" y="188" width="175" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="847" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)" dy="3.8">Prior charts indexed</text>
</g>

<!-- 6. Waymark -> SpanCheck -->
<polyline class="edge" points="615,541 615,605" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />

<!-- 7. SpanCheck -> ResumePkt: Compaction triggers -->
<polyline class="edge" points="615,651 615,715 720,715 720,775" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="585" y="700" width="165" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="667" y="714" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)" dy="3.8">Context compaction triggers</text>
</g>

<!-- 8. ResumePkt -> Waymark: Immediate resumption -->
<polyline class="edge" points="880,775 880,541" fill="none" stroke="var(--_arrow)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="800" y="660" width="160" height="28" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="880" y="674" text-anchor="middle" font-size="11" font-weight="500" fill="var(--_text-sec)" dy="3.8">Agent resumes in 1 step</text>
</g>

<!-- 9. Waymark -> Capn: Trajectory sealed (Left rail) -->
<polyline class="edge" points="360,518 80,518 80,110 685,110" fill="none" stroke="var(--_line)" stroke-width="1.25" marker-end="url(#arrowhead)" />
<g class="edge-label">
  <rect x="20" y="320" width="120" height="42" rx="4" ry="4" fill="var(--_badge-fill)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="80" y="335" text-anchor="middle" font-size="10" font-weight="500" fill="var(--_text-sec)" dy="3.5">Trajectory sealed</text>
  <text x="80" y="349" text-anchor="middle" font-size="9" font-weight="400" fill="var(--_text-muted)" dy="3.5">(chart into Capn)</text>
</g>

</svg>