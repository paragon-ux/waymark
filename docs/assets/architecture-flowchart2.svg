<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 940" width="1080" height="940" style="background:#0B0F19; font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;">
<defs>
  <!-- Arrowhead Markers -->
  <marker id="arrow-blue" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#60A5FA" />
  </marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#34D399" />
  </marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#FBBF24" />
  </marker>
  <marker id="arrow-violet" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#A78BFA" />
  </marker>
  <marker id="arrow-slate" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 9 3, 0 6" fill="#94A3B8" />
  </marker>

  <!-- Drop Shadows for Node Cards -->
  <filter id="shadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
  </filter>
</defs>

<!-- ========================================================================= -->
<!-- GROUP 1: LAYER 4 — CROSS-SESSION MEMORY & DISCOVERY ROUTER                 -->
<!-- ========================================================================= -->
<g class="subgraph">
  <!-- Container Background -->
  <rect x="140" y="42" width="820" height="130" rx="8" ry="8" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
  <!-- Header Bar -->
  <path d="M 140 50 Q 140 42 148 42 L 952 42 Q 960 42 960 50 L 960 70 L 140 70 Z" fill="#1E293B" stroke="#1F2937" stroke-width="1.5" />
  <text x="160" y="56" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.08em" text-anchor="start" dy="3.5">LAYER 4: CROSS-SESSION MEMORY &amp; TWO-PHASE DISCOVERY GATEWAY</text>

  <!-- Node 1: Two-Phase Router -->
  <g class="node" filter="url(#shadow)">
    <rect x="165" y="86" width="390" height="66" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="360" y="110" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">capn_ask (Two-Phase Discovery Router)</text>
    <text x="360" y="132" font-size="11" font-weight="500" fill="#C4B5FD" text-anchor="middle">Routes structural AST queries vs. conceptual memory</text>
  </g>

  <!-- Node 2: Capn Hook -->
  <g class="node" filter="url(#shadow)">
    <rect x="585" y="86" width="350" height="66" rx="6" ry="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <text x="760" y="110" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Capn Hook (Charted Knowledge Base)</text>
    <text x="760" y="132" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Durable Q&amp;A memory &amp; architectural rationale</text>
  </g>
</g>

<!-- ========================================================================= -->
<!-- GROUP 2: LAYERS 1 & 2 — CODEBASE DISCOVERY                                 -->
<!-- ========================================================================= -->
<g class="subgraph">
  <!-- Container Background -->
  <rect x="140" y="235" width="820" height="135" rx="8" ry="8" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
  <!-- Header Bar -->
  <path d="M 140 243 Q 140 235 148 235 L 952 235 Q 960 235 960 243 L 960 263 L 140 263 Z" fill="#1E293B" stroke="#1F2937" stroke-width="1.5" />
  <text x="160" y="249" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.08em" text-anchor="start" dy="3.5">LAYERS 1 &amp; 2: CODEBASE DISCOVERY (ON-DEMAND LOCAL AST + DEEP INDEXERS)</text>

  <!-- Node 3: Built-in Tree-sitter WASM (Layer 1) -->
  <g class="node" filter="url(#shadow)">
    <rect x="165" y="280" width="390" height="68" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="360" y="304" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Built-in Tree-sitter WASM (&lt;50ms)</text>
    <text x="360" y="326" font-size="11" font-weight="500" fill="#6EE7B7" text-anchor="middle">In-process call graphs &amp; symbol spans (30+ langs, 0 daemons)</text>
  </g>

  <!-- Node 4: Deep Indexers (Layer 2) -->
  <g class="node" filter="url(#shadow)">
    <rect x="585" y="280" width="350" height="68" rx="6" ry="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <text x="760" y="304" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Deep Indexers (QMD &amp; Language Servers)</text>
    <text x="760" y="326" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Whole-repo hybrid BM25, embeddings &amp; type graphs</text>
  </g>
</g>

<!-- ========================================================================= -->
<!-- GROUP 3: LAYER 3 — IN-FLIGHT CONTINUITY LEDGER                            -->
<!-- ========================================================================= -->
<g class="subgraph">
  <!-- Container Background -->
  <rect x="140" y="445" width="820" height="445" rx="8" ry="8" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
  <!-- Header Bar -->
  <path d="M 140 453 Q 140 445 148 445 L 952 445 Q 960 445 960 453 L 960 473 L 140 473 Z" fill="#1E293B" stroke="#1F2937" stroke-width="1.5" />
  <text x="160" y="459" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.08em" text-anchor="start" dy="3.5">LAYER 3: IN-FLIGHT CONTINUITY LEDGER (paragon-ux/waymark)</text>

  <!-- Node 5: Waymark MCP Server -->
  <g class="node" filter="url(#shadow)">
    <rect x="250" y="495" width="600" height="68" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6" stroke-width="2" />
    <text x="550" y="519" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Waymark MCP Server (Append-Only NDJSON Journal)</text>
    <text x="550" y="541" font-size="11.5" font-weight="500" fill="#93C5FD" text-anchor="middle">Durable in-flight investigation ledger (.waymark/journal.ndjson)</text>
  </g>

  <!-- Node 6: Span Integrity Scanner -->
  <g class="node" filter="url(#shadow)">
    <rect x="250" y="618" width="600" height="68" rx="6" ry="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <text x="550" y="642" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Span Integrity &amp; Relocation Scanner (Git HEAD Verified)</text>
    <text x="550" y="664" font-size="11.5" font-weight="500" fill="#94A3B8" text-anchor="middle">Scans relocated lines (MOVED ±2k), STALE quarantines, &amp; CROSS_BRANCH</text>
  </g>

  <!-- Node 7: Bounded Resume Packet -->
  <g class="node" filter="url(#shadow)">
    <rect x="460" y="780" width="410" height="68" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.8" />
    <text x="665" y="804" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bounded Resume Packet (&lt;2,048 bytes)</text>
    <text x="665" y="826" font-size="11.5" font-weight="500" fill="#FDE68A" text-anchor="middle">Injects verified breadcrumbs in 1 step (~216 tokens / 820 B)</text>
  </g>
</g>

<!-- ========================================================================= -->
<!-- CONNECTING EDGES & HIGH-CONTRAST LABELS                                   -->
<!-- ========================================================================= -->

<!-- 1. Router -> WASM AST (Phase 1 Structural Intent) -->
<polyline points="360,152 360,280" fill="none" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrow-green)" />
<g filter="url(#shadow)">
  <rect x="235" y="196" width="250" height="26" rx="4" ry="4" fill="#0F172A" stroke="#34D399" stroke-width="1" />
  <text x="360" y="209" font-size="10.5" font-weight="600" fill="#34D399" text-anchor="middle" dy="3.5">Phase 1: Structural query ("Who calls X?")</text>
</g>

<!-- 2. Router -> Capn Hook (Phase 2 Conceptual Intent / Fallback) -->
<polyline points="555,119 585,119" fill="none" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#arrow-violet)" />
<g filter="url(#shadow)">
  <rect x="525" y="72" width="95" height="22" rx="4" ry="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1" />
  <text x="572" y="83" font-size="9.5" font-weight="600" fill="#DDD6FE" text-anchor="middle" dy="3">Phase 2: Rationale</text>
</g>

<!-- 3. WASM AST -> Waymark (Verified AST Hops) -->
<polyline points="360,348 360,420 410,420 410,495" fill="none" stroke="#60A5FA" stroke-width="1.8" marker-end="url(#arrow-blue)" />
<g filter="url(#shadow)">
  <rect x="245" y="407" width="240" height="26" rx="4" ry="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1" />
  <text x="365" y="420" font-size="10.5" font-weight="600" fill="#93C5FD" text-anchor="middle" dy="3.5">Agent records verified hops (waymark_note)</text>
</g>

<!-- 4. Deep Indexers -> Waymark (Deep Candidates Explored) -->
<polyline points="760,348 760,420 690,420 690,495" fill="none" stroke="#60A5FA" stroke-width="1.8" marker-end="url(#arrow-blue)" />
<g filter="url(#shadow)">
  <rect x="620" y="407" width="220" height="26" rx="4" ry="4" fill="#0F172A" stroke="#64748B" stroke-width="1" />
  <text x="730" y="420" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle" dy="3.5">Deep candidate matches explored</text>
</g>

<!-- 5. Capn Hook -> Deep Indexers (Dotted - Prior Charts Indexed) -->
<polyline points="760,152 760,280" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-slate)" />
<g filter="url(#shadow)">
  <rect x="675" y="196" width="170" height="26" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="760" y="209" font-size="10.5" font-weight="500" fill="#94A3B8" text-anchor="middle" dy="3.5">Prior charts indexed</text>
</g>

<!-- 6. Waymark -> Span Integrity Scanner -->
<polyline points="550,563 550,618" fill="none" stroke="#60A5FA" stroke-width="1.8" marker-end="url(#arrow-blue)" />
<g filter="url(#shadow)">
  <rect x="470" y="577" width="160" height="24" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="550" y="589" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle" dy="3">Validates Git worktree state</text>
</g>

<!-- 7. Span Integrity Scanner -> Bounded Resume Packet -->
<polyline points="665,686 665,780" fill="none" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arrow-amber)" />
<g filter="url(#shadow)">
  <rect x="575" y="720" width="180" height="26" rx="4" ry="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
  <text x="665" y="733" font-size="10.5" font-weight="600" fill="#FBBF24" text-anchor="middle" dy="3.5">Context compaction triggers</text>
</g>

<!-- 8. Bounded Resume Packet -> Waymark MCP (Resumption Loop) -->
<polyline points="870,814 915,814 915,529 850,529" fill="none" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arrow-amber)" />
<g filter="url(#shadow)">
  <rect x="795" y="658" width="220" height="26" rx="4" ry="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
  <text x="905" y="671" font-size="10.5" font-weight="600" fill="#FDE68A" text-anchor="middle" dy="3.5">Agent resumes prefix (waymark_resume)</text>
</g>

<!-- 9. Waymark -> Capn Hook (Trajectory Sealing - Clear Left Bypass Rail) -->
<polyline points="250,529 65,529 65,22 760,22 760,86" fill="none" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#arrow-violet)" />
<g filter="url(#shadow)">
  <rect x="10" y="285" width="110" height="42" rx="5" ry="5" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2" />
  <text x="65" y="302" font-size="10.5" font-weight="600" fill="#DDD6FE" text-anchor="middle">Trajectory sealed</text>
  <text x="65" y="316" font-size="9.5" font-weight="500" fill="#A78BFA" text-anchor="middle">(waymark_complete)</text>
</g>

</svg>